[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdock"
version = "0.1.0"
description = "On-demand skill infrastructure for AI coding agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "SQLAlchemy>=2.0,<3",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.4,<3",
  "email-validator>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "boto3>=1.35,<2",
  "alembic>=1.13,<2",
  "docker>=7.1,<8",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
agentdock = "cli.agentdock:main"

[tool.setuptools]
packages = ["backend", "backend.agentdock", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
